<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <meta name="color-scheme" content="light dark">
  <!-- CSS보다 먼저 실행해 테마 깜빡임(FOUC)을 막는다 -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#content">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="#/">My Blog</a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="다크모드 전환">
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="content" class="container" tabindex="-1" aria-live="polite">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> My Blog</div>
  </footer>

  <noscript><p class="container status">이 블로그는 JavaScript가 필요합니다.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
